<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18191C"/>
      <stop offset="100%" stop-color="#1E1F22"/>
    </linearGradient>

    <!-- JetBrains Rider accent gradient (orange → warm red) -->
    <linearGradient id="rider" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CF8E6D"/>
      <stop offset="50%" stop-color="#DD5145"/>
      <stop offset="100%" stop-color="#C21A4E"/>
    </linearGradient>

    <!-- Visual Studio accent gradient (purple → blue) -->
    <linearGradient id="vs" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C77DBB"/>
      <stop offset="50%" stop-color="#7B5EA7"/>
      <stop offset="100%" stop-color="#4A2D8A"/>
    </linearGradient>

    <!-- Custom/original theme gradient (teal → green) -->
    <linearGradient id="custom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2AACB8"/>
      <stop offset="50%" stop-color="#3DAD6E"/>
      <stop offset="100%" stop-color="#6AAB73"/>
    </linearGradient>

    <!-- Center merge glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3574F0" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#3574F0" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#3574F0" stop-opacity="0"/>
    </radialGradient>

    <!-- Connecting line gradient -->
    <linearGradient id="conn1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DD5145" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3574F0" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="conn2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7B5EA7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3574F0" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="conn3" gradientUnits="userSpaceOnUse" x1="128" y1="178" x2="128" y2="140">
      <stop offset="0%" stop-color="#3DAD6E" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3574F0" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="256" height="256" rx="44" fill="url(#bg)"/>
  <rect x="0.75" y="0.75" width="254.5" height="254.5" rx="43.25" fill="none" stroke="#2B2D30" stroke-width="0.75"/>

  <!-- Center glow where themes converge -->
  <circle cx="128" cy="125" r="50" fill="url(#glow)"/>

  <!-- Connecting lines from each logo to center (ending outside the VS Code icon) -->
  <line x1="80" y1="82" x2="113" y2="113" stroke="url(#conn1)" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="176" y1="85" x2="143" y2="113" stroke="url(#conn2)" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="128" y1="178" x2="128" y2="140" stroke="url(#conn3)" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

  <!-- ═══ JetBrains Rider logo (top-left) ═══ -->
  <!-- Straight rounded square with dark inset and R letter -->
  <g transform="translate(80, 55)">
    <!-- Outer rounded square -->
    <rect x="-27" y="-27" width="54" height="54" rx="10" fill="url(#rider)" opacity="0.95"/>
    <!-- Inner dark square -->
    <rect x="-19" y="-19" width="38" height="38" rx="4" fill="#1E1F22"/>
    <!-- "R" letter for Rider -->
    <text x="0" y="8" font-family="'JetBrains Mono', 'Cascadia Code', 'Consolas', monospace" font-size="28" font-weight="800" fill="url(#rider)" text-anchor="middle">R</text>
  </g>

  <!-- ═══ Visual Studio logo (top-right) ═══ -->
  <!-- Symmetrical shield/badge shape -->
  <g transform="translate(176, 55)">
    <!-- Outer shield (symmetrical) -->
    <path d="M-24,-28 L24,-28 L27,-14 L27,20 L0,30 L-27,20 L-27,-14 Z" fill="url(#vs)" opacity="0.95"/>
    <!-- Inner dark shield -->
    <path d="M-17,-20 L17,-20 L19,-10 L19,14 L0,22 L-19,14 L-19,-10 Z" fill="#1E1F22"/>
    <!-- "VS" text -->
    <text x="0" y="8" font-family="'Segoe UI', 'SF Pro Display', Arial, sans-serif" font-size="18" font-weight="800" fill="url(#vs)" text-anchor="middle" letter-spacing="-1">VS</text>
  </g>

  <!-- ═══ Custom/Original theme logo (bottom-center) ═══ -->
  <!-- Hexagon with a star/sparkle inside -->
  <g transform="translate(128, 208)">
    <!-- Hexagon -->
    <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15" fill="url(#custom)" opacity="0.95"/>
    <!-- Inner dark hexagon -->
    <polygon points="0,-21 18,-10.5 18,10.5 0,21 -18,10.5 -18,-10.5" fill="#1E1F22"/>
    <!-- 4-point sparkle/star (creativity symbol) -->
    <path d="M0,-12 C2,-3 3,-2 12,0 C3,2 2,3 0,12 C-2,3 -3,2 -12,0 C-3,-2 -2,-3 0,-12 Z" fill="url(#custom)" opacity="0.95"/>
  </g>

  <!-- Center convergence point — VS Code logo -->
  <g transform="translate(128, 125) scale(0.028)">
    <g transform="translate(-512, -512)">
      <path d="M717.075 65.426L390.39 338.162 181.657 187.487 100 222.948v578.103l81.657 35.462 208.733-150.676L717.075 958.574 924 870.252V153.748zm0 206.725v479.698L458.856 512z" fill="#3574F0"/>
      <path d="M717.075 65.426L390.39 338.162 181.657 187.487 100 222.948v578.103l81.657 35.462 208.733-150.676L717.075 958.574 924 870.252V153.748zM181.657 699.305V324.695L390.39 512zm535.418 52.748L458.856 512l258.219-240.053z" fill="#56A8F5" opacity="0.8"/>
    </g>
  </g>
</svg>
